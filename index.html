<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Branchs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Atividade de Git Branches</h1>

    <p>Projeto para praticar branches, commits, merges e pull requests.</p>

    <h2>Contador</h2>

<p id="contador">0</p>

<button onclick="diminuir()">-</button>
<button onclick="aumentar()">+</button>

<h2>Modo de visualização</h2>

<button onclick="alternarTema()">Alternar modo escuro</button>

<h2>Calculadora</h2>

<input type="number" id="numero1" placeholder="Número 1">
<input type="number" id="numero2" placeholder="Número 2">

<button onclick="somar()">Somar</button>
<button onclick="subtrair()">Subtrair</button>

<p id="resultado"></p>

<h2>Relógio</h2>

<p id="relogio"></p>

    <script src="script.js"></script>
</body>
</html>
